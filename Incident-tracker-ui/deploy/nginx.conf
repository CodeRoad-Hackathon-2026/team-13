server {
    listen 80;
    server_name _;

    # /api is proxied rather than served, so the browser only ever talks to one
    # origin. That is also what keeps RAG Core's credentials out of reach: the
    # orchestrator is the only thing that holds them, and it is not exposed here.
    location /api/ {
        proxy_pass http://orchestrator:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # An execution can take a while to settle; the dashboard polls rather
        # than holding a request open, but approve itself must not time out.
        proxy_read_timeout 120s;
    }

    location / {
        root /usr/share/nginx/html;
        # Deep links like /?incident=<id> are query strings, but the drawer and
        # tabs are URL state — any unknown path still has to land on the SPA.
        try_files $uri $uri/ /index.html;
    }
}
